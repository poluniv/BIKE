<style>
:root{--bg:#f1f3f4;--card:#fff;--ink:#12181d;--mut:#5b6670;--line:#d9dee2;--soft:#e9edf0;--acc:#0b5f8a;--ok:#1a8f5c;--warn:#c98a0b;--bad:#c9343a;--rim:#a4adb6;--f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1317;--card:#161d23;--ink:#e8edf0;--mut:#8e9aa4;--line:#26313a;--soft:#1d262d;--acc:#4aa3d4;--ok:#35b57c;--warn:#e0a526;--bad:#e5575d;--rim:#56626d}}
:root[data-theme="dark"]{--bg:#0e1317;--card:#161d23;--ink:#e8edf0;--mut:#8e9aa4;--line:#26313a;--soft:#1d262d;--acc:#4aa3d4;--ok:#35b57c;--warn:#e0a526;--bad:#e5575d;--rim:#56626d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:24px 0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card)}
.logo{font-weight:700;font-size:20px;padding:0 22px 22px}

main{padding:32px clamp(16px,3vw,48px) 60px;width:100%;min-width:0}

.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}

.pc{font-weight:700;text-align:right}
.mut{color:var(--mut);font-size:13px}
.rec{grid-column:1/-1;font-size:13px;border-left:3px solid var(--bad);background:var(--soft);padding:8px 12px;border-radius:0 6px 6px 0}
.rec.w{border-color:var(--warn)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:26px;text-align:center;background:var(--card);cursor:pointer;margin-bottom:18px}

.rl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.fg h3{grid-column:1/-1;font-size:13px;color:var(--mut);margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.fl label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fl.w{grid-column:1/-1}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.sw input{width:48px;height:32px;padding:2px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
@media (max-width:820px){
.app{display:block}
nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;overflow-x:auto;padding:0 0 env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);border-right:0;z-index:5}

.hero{grid-template-columns:1fr}
.art{border-radius:8px 8px 0 0}

.lk{display:flex;gap:8px}a.btn{text-decoration:none;display:inline-block}.sec{margin:22px 0 10px}

.vd{border-left:4px solid var(--ok);background:var(--card);border-radius:0 8px 8px 0;border:1px solid var(--line);border-left:4px solid var(--ok);padding:14px 18px;margin-top:16px}.vd p{margin:4px 0 0}
.tg{background:var(--ok);color:#fff;border-radius:4px;font-size:11px;font-weight:700;padding:2px 7px;margin-left:6px;white-space:nowrap}
.pq{display:flex;flex-direction:column;gap:5px;width:150px}.pt{font-weight:600;font-size:14px}.pr{display:block;height:6px;background:var(--soft);border-radius:6px;position:relative}.pr i{display:block;height:100%;background:var(--acc);border-radius:6px}
.wr{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(80px,1fr) 70px minmax(150px,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.wr:last-child{border:0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 16px;font-weight:600}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plan{display:grid;grid-template-columns:240px 1fr;gap:6px 18px;padding:16px 18px;font-size:14px}.plan b{font-weight:600}
@media (max-width:820px){.wr{grid-template-columns:1fr 70px}.wr .bar,.wr>span,.wr>a{grid-column:1/-1}.plan{grid-template-columns:1fr}}

h2{font-family:"Instrument Serif",Archivo,serif;font-weight:400;font-size:25px}
.panel{border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 34px -18px rgba(10,30,50,.28)}
nav{background:linear-gradient(180deg,#101c25,#0a1117);border-right:0}
.logo{font-family:"Instrument Serif",serif;font-weight:400;font-size:32px;color:#fff;letter-spacing:.01em}
nav button{color:#9fb0bd}nav button.on{background:rgba(255,255,255,.08);color:#fff}
.btn{border-radius:99px;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px var(--acc)}
.bk{border-radius:12px;transition:border-color .2s,transform .2s}.bk:hover{transform:translateY(-2px)}
.prow{transition:background .2s}
.head.bn{position:relative;overflow:hidden;border-radius:18px;padding:40px 30px 26px;min-height:150px;color:#fff;margin-bottom:24px}
.bn .bg{position:absolute;inset:0;width:100%;height:100%}.bn>*:not(.bg){position:relative}
.bn::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 70%)}
.bn h1{font-family:"Instrument Serif",Archivo,serif;font-weight:400;font-size:clamp(36px,5.5vw,56px);color:#fff}
.bn p{color:rgba(255,255,255,.88)}.bn .btn.g{color:#fff;border-color:rgba(255,255,255,.5)}
.bn>*:not(.bg){z-index:1}
.art{padding:0;border-radius:14px 0 0 14px;overflow:hidden}
.pw{min-height:420px}.pw.dk{background:radial-gradient(120% 90% at 50% 15%,#3d4b57,#0c1115)}
#cv{width:100%;height:420px;display:block;touch-action:pan-y;cursor:grab}
.vt{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
.dk .chip{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22);padding:5px 14px;font-size:13px}.dk .chip.on{background:#fff;color:#111}
.hint{position:absolute;right:14px;bottom:14px;color:#9fb0bd;font-size:12px}
.pw .th{position:absolute;left:12px;top:54px;display:flex;flex-direction:column;gap:6px}
.th button{padding:0;border:2px solid transparent;border-radius:9px;background:none;overflow:hidden}.th .on{border-color:#fff}
.pw .th img{width:58px;height:42px;max-height:none;border-radius:6px}
.ic{width:22px;height:22px;margin-right:10px;vertical-align:-5px;color:var(--acc)}
main>*{animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
@media (max-width:820px){.pw.dk,.art{border-radius:14px 14px 0 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const DEF={name:"",brand:"",type:"Carretera",size:"M",km:0,wt:0,frame:"Carboni",color:"#0b5f8a",wheel:"700c",rim:"Alumini",tireW:28,tt:"Tubeless",tireModel:"",group:"Shimano 105",spd:12,shift:"Mecànic",rings:"2 plats (2x)",brake:"Disc hidràulic"};

return `<div class="pw dk"><div class="vt"><button class="chip ${v==="3d"?"on":""}" data-a="view" data-v="3d">Model 3D</button><button class="chip ${v==="foto"?"on":""}" data-a="view" data-v="foto">Fotos (${im.length})</button></div>${v==="3d"?`<canvas id="cv" role="img" aria-label="Model 3D de ${esc(b.name)}"></canvas><span class="hint">Arrossega per girar</span>`:`<img src="${im[k]||im[0]}" alt="Foto de ${esc(b.name)}"><div class="th">${im.map((x,i)=>`<button data-a="ph" data-i="${i}" class="${i===k?"on":""}" aria-label="Foto ${i+1}"><img src="${x}" alt=""></button>`).join("")}</div>`}<div class="pcb">${im.length<4?up:""}</div></div>`}

function parseGPX(txt,fn){

function mapSVG(r){
