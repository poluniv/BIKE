<style>
:root{--bg:#f1f3f4;--card:#fff;--ink:#12181d;--mut:#5b6670;--line:#d9dee2;--soft:#e9edf0;--acc:#0b5f8a;--ok:#1a8f5c;--warn:#c98a0b;--bad:#c9343a;--rim:#a4adb6;--f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

:root[data-theme="dark"]{--bg:#0e1317;--card:#161d23;--ink:#e8edf0;--mut:#8e9aa4;--line:#26313a;--soft:#1d262d;--acc:#4aa3d4;--ok:#35b57c;--warn:#e0a526;--bad:#e5575d;--rim:#56626d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}

.logo{font-weight:700;font-size:20px;padding:0 22px 22px}

main{padding:32px clamp(16px,3vw,48px) 60px;width:100%;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}

.bk span{font-size:13px;color:var(--mut)}

.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}

.rec.w{border-color:var(--warn)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:26px;text-align:center;background:var(--card);cursor:pointer;margin-bottom:18px}

.rl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-bottom:1px solid var(--line)}

.soon{padding:26px;max-width:600px}
.soon ul{color:var(--mut);padding-left:18px;margin:10px 0 0}
dialog{border:1px solid var(--line);border-radius:10px;padding:24px;background:var(--card);color:var(--ink);width:min(580px,94vw);max-height:90vh}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.fg h3{grid-column:1/-1;font-size:13px;color:var(--mut);margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.fl label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fl.w{grid-column:1/-1}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.sw input{width:48px;height:32px;padding:2px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
@media (max-width:820px){
.app{display:block}
nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;overflow-x:auto;padding:0 0 env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);border-right:0;z-index:5}
nav .logo,nav .sp{display:none}
nav button{flex:1 0 auto;text-align:center;padding:12px 12px;font-size:12px;border-left:0;border-top:3px solid transparent}

main{padding-bottom:96px}
.hero{grid-template-columns:1fr}
.art{border-radius:8px 8px 0 0}
.prow{grid-template-columns:52px 1fr 50px;gap:8px 12px}

.prow .mut,.prow .btn,.prow .rec{grid-column:1/-1;order:2}
.fg{grid-template-columns:1fr}}
.fi{font:inherit;font-size:13px;color:var(--mut);max-width:100%}
.fi::file-selector-button{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 16px;margin-right:12px;cursor:pointer}

.pcb{position:absolute;left:12px;bottom:12px;background:var(--card);padding:6px;border-radius:8px;border:1px solid var(--line)}
.pe{padding:40px 24px;text-align:center;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}.pe b{font-size:18px}

.prow{cursor:pointer}.prow:hover{background:var(--soft)}

.it{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.it:last-child{border:0}
.lk{display:flex;gap:8px}a.btn{text-decoration:none;display:inline-block}.sec{margin:22px 0 10px}

.vd{border-left:4px solid var(--ok);background:var(--card);border-radius:0 8px 8px 0;border:1px solid var(--line);border-left:4px solid var(--ok);padding:14px 18px;margin-top:16px}.vd p{margin:4px 0 0}
.tg{background:var(--ok);color:#fff;border-radius:4px;font-size:11px;font-weight:700;padding:2px 7px;margin-left:6px;white-space:nowrap}
.pq{display:flex;flex-direction:column;gap:5px;width:150px}.pt{font-weight:600;font-size:14px}.pr{display:block;height:6px;background:var(--soft);border-radius:6px;position:relative}.pr i{display:block;height:100%;background:var(--acc);border-radius:6px}
.wr{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(80px,1fr) 70px minmax(150px,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.wr:last-child{border:0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 16px;font-weight:600}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plan{display:grid;grid-template-columns:240px 1fr;gap:6px 18px;padding:16px 18px;font-size:14px}.plan b{font-weight:600}
@media (max-width:820px){.wr{grid-template-columns:1fr 70px}.wr .bar,.wr>span,.wr>a{grid-column:1/-1}.plan{grid-template-columns:1fr}}
.btn{transition:filter .15s,transform .1s}.btn:hover{filter:brightness(1.08)}.btn.g:hover{background:var(--soft);filter:none}
:root{--sh:0 1px 2px rgba(0,0,0,.06),0 10px 28px -14px rgba(0,0,0,.3)}
.panel,.bk,.kpi{box-shadow:var(--sh)}
nav button{display:flex;align-items:center;gap:12px;transition:background .15s,color .15s}
nav button:hover{color:var(--ink)}
nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;letter-spacing:-.02em}.logo svg{width:28px;height:28px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 18px}.kpi span{font-size:13px;color:var(--mut)}.kpi b{display:block;font-size:26px;line-height:1.25}
.ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(150deg,var(--soft),var(--card));border:1px solid var(--line);flex:none}
.ic svg{width:34px;height:34px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.ic svg .a{stroke:var(--acc)}
.ic.l{width:84px;height:84px;border-radius:16px}.ic.l svg{width:56px;height:56px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
main>*{animation:fi .35s ease both}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
@media (max-width:820px){nav button{flex-direction:column;gap:3px;font-size:11px;padding:9px 10px}nav svg{width:22px;height:22px}}
.chat{display:flex;flex-direction:column;gap:12px}
.msgs{height:min(58vh,560px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh)}
.m{display:flex}.m.u{justify-content:flex-end}
.b{max-width:min(720px,88%);padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.m.a .b{background:var(--soft)}.m.u .b{background:var(--acc);color:#fff}
.cin{display:flex;gap:10px;align-items:flex-end}
.cin textarea{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 14px;resize:none;min-height:46px;max-height:140px}
</style>

const G=[["Lubricant de cadena",LU[c]],["Neteja",[["Muc-Off Bio Drivetrain Cleaner","Desengreixant de la transmissió",12,18,1],["Park Tool CB-4","Desengreixant biodegradable",12,20],["Finish Line Super Bike Wash","Neteja general del quadre",10,15]]],["Protecció i greix",[["Muc-Off Bike Protect","Protegeix i dona brillantor al quadre",10,16],["Park Tool PolyLube 1000","Greix per a rosques i coixinets",8,14,1],["Finish Line Premium Grease","Greix multiús amb teflon",8,14]]]];
if(b&&b.frame==="Carboni")G[2][1].push(["Finish Line Fiber Grip","Pasta de muntatge per a carboni",12,18]);
if(dk)G[1][1].push(["Muc-Off Disc Brake Cleaner","Neteja de discs i pastilles",10,15]);
if(b&&b.tt==="Tubeless")G.push(["Tubeless",[["Stan’s NoTubes Race Sealant","Líquid segellant, renova’l cada 3 a 6 mesos",15,25,1],["Muc-Off No Puncture Hassle","Alternativa de preu similar",15,25]]]);
G.push(["Eines",[["Clau dinamomètrica 2–10 Nm","Evita estrènyer de més el carboni i els components lleugers",30,60]]]);
const PL=[["Cada sortida","Pressió de les cobertes i revisió ràpida dels frens"],["Cada 200 a 300 km o després de pluja","Netejar i lubricar la cadena"],["Cada 2 a 4 setmanes","Rentar la bici i revisar l’estat de les cobertes"],["Cada 1.000 km","Neteja a fons de la transmissió i mesura del desgast de la cadena"],b&&b.tt==="Tubeless"?["Cada 3 a 6 mesos","Renovar el líquid tubeless"]:null,["Un cop l’any","Revisar frens (purga si són hidràulics), cables, folres i coixinets"]].filter(Boolean);
return head("Manteniment","Productes recomanats i quan cal fer cada tasca.")+`<div class="pills" style="display:flex;gap:8px;margin-bottom:6px">${[["sec","En sec"],["mullat","Amb pluja"],["cera","Cera"]].map(x=>`<button class="chip ${c===x[0]?"on":""}" data-a="cond" data-c="${x[0]}">${x[1]}</button>`).join("")}</div>`+grups(G,mxOf(G))+`<h2 class="sec">Calendari de manteniment</h2><section class="panel plan">${PL.map(x=>`<b>${x[0]}</b><span>${x[1]}</span>`).join("")}</section><p class="mut" style="margin-top:14px">Preus orientatius de mercat; comprova el preu actual a la botiga.</p>`}
const addKm=(b,v)=>{b.total+=v;PARTS.forEach(p=>b.w[p.k]=Math.min(p.life*1.2,b.w[p.k]+v))};
const head=(t,s,a)=>`<div class="head"><div><h1>${t}</h1><p>${s}</p></div>${a||""}</div>`;
function garatge(){
if(S.part&&S.bikes.length)return detail();
if(!S.bikes.length)return head("Garatge","Afegeix la teva bici real per seguir-ne el desgast.",`<button class="btn" data-a="new">Afegeix una bici</button>`);
const b=bike(),h=health(b),low=PARTS.filter(p=>pct(b,p)<=40).length;
const sp=[["Quadre",`${b.frame}, talla ${b.size}`],["Rodes",`${b.wheel}, ${b.rim.toLowerCase()}`],["Neumàtics",`${b.tireW} mm ${b.tt.toLowerCase()}${b.tireModel?", "+esc(b.tireModel):""}`],["Transmissió",`${esc(b.group)}, ${b.spd} velocitats, ${b.shift.toLowerCase()}, ${b.rings}`],["Frens",b.brake],["Recorregut",nf(b.total)+" km"]];
return head("Garatge","Configura la teva bici i sabràs quan toca canviar cada peça.")+
`<div class="bikes">${S.bikes.map(x=>`<button class="bk ${x.id===b.id?"on":""}" data-a="pick" data-id="${x.id}"><b>${esc(x.name)}</b><span>${x.type}, ${nf(x.total)} km</span><i style="--v:${health(x)}%;--c:${col(health(x))}"></i></button>`).join("")}<button class="bk add" data-a="new">Afegeix una bici</button></div>
${kpis(b,h,low)}<section class="panel hero"><div class="art">${artBox(b)}</div><div class="spec"><div class="top"><div><h2 style="margin:0">${esc(b.name)}</h2><span class="mut">${esc(b.brand||b.type)}</span></div><button class="btn g s" data-a="edit">Edita</button></div>
<div class="hl">${gauge(h)}<div><b style="font-size:22px;color:${col(h)}">Salut ${h>60?"bona":h>35?"mitjana":"baixa"}</b><div class="mut">${low?`${low} ${low>1?"components demanen":"component demana"} atenció`:"Tot sota control"}</div></div></div>
<dl>${sp.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl>
<button class="btn g s" data-a="del" style="margin-top:14px">${S.confirm===b.id?"Segur? Toca per eliminar":"Elimina la bici"}</button></div></section>
<section class="panel ride"><b>Suma quilòmetres</b><input id="gpx" class="fi" type="file" accept=".gpx,application/gpx+xml,.xml" multiple aria-label="Puja un GPX"><span class="mut">o escriu-los a mà</span><input id="km" type="number" min="1" max="1000" inputmode="numeric" placeholder="Quilòmetres" aria-label="Quilòmetres de la sortida"><button class="btn" data-a="km">Suma els km</button></section>
<h2>Estat dels components</h2><section class="panel">${PARTS.map(p=>{const v=pct(b,p),left=Math.max(0,p.life-b.w[p.k]);
return `<div class="prow" data-a="part" data-k="${p.k}"><span class="ic">${ico(p.k)}</span><button class="pn" data-a="part" data-k="${p.k}">${p.n}</button><div class="bar" role="img" aria-label="${p.n}: ${v}% de vida útil"><i style="width:${v}%;background:${col(v)}"></i></div><span class="pc" style="color:${col(v)}">${v}%</span><span class="mut">${nf(left)} km fins al canvi</span><button class="btn g s" data-a="reset" data-k="${p.k}">Ja l’he canviat</button>
${v<=40?`<div class="rec ${v>15?"w":""}"><b>${v>15?"Convé planificar el canvi":"Canvi urgent"}.</b> ${p.rec.replace("{s}",b.spd).replace("{t}",b.tireW).replace("{f}",b.brake.toLowerCase()).replace("{g}",esc(b.group))}</div>`:""}</div>`}).join("")}</section>`}
function parseGPX(txt,fn){
const d=new DOMParser().parseFromString(txt,"application/xml");let n=[...d.getElementsByTagName("trkpt")];if(n.length<2)n=[...d.getElementsByTagName("rtept")];if(n.length<2)return null;
const T=e=>{const t=e.getElementsByTagName("time")[0];return t?Date.parse(t.textContent):NaN};
const pts=n.map(e=>{const el=e.getElementsByTagName("ele")[0];return [+e.getAttribute("lat"),+e.getAttribute("lon"),el?+el.textContent:0]}).filter(p=>isFinite(p[0])&&isFinite(p[1]));
if(pts.length<2)return null;
let dist=0,gain=0,last=pts[0][2];const rad=Math.PI/180;
pts.forEach((p,i)=>{if(i){const q=pts[i-1],a=Math.sin((p[0]-q[0])*rad/2)**2+Math.cos(q[0]*rad)*Math.cos(p[0]*rad)*Math.sin((p[1]-q[1])*rad/2)**2;dist+=12742000*Math.asin(Math.sqrt(a))}
if(Math.abs(p[2]-last)>=3){if(p[2]>last)gain+=p[2]-last;last=p[2]}p.push(dist)});
const st=Math.ceil(pts.length/500),s=pts.filter((p,i)=>i%st===0||i===pts.length-1).map(p=>[+p[0].toFixed(5),+p[1].toFixed(5),Math.round(p[2]),Math.round(p[3])]);
const t0=T(n[0]),t1=T(n[n.length-1]),e=s.map(p=>p[2]),nm=d.getElementsByTagName("name")[0];
return {id:Date.now()+Math.random(),name:(nm&&nm.textContent.trim())||fn,date:isFinite(t0)?new Date(t0).toISOString().slice(0,10):new Date().toISOString().slice(0,10),dist:Math.round(dist),gain:Math.round(gain),min:Math.min(...e),max:Math.max(...e),dur:isFinite(t0)&&isFinite(t1)?Math.round((t1-t0)/1000):0,ele:e.some(v=>v!==0),pts:s,added:false}}
function mapSVG(r){
const P=r.pts,la=P.map(p=>p[0]),lo=P.map(p=>p[1]),la0=Math.min(...la),la1=Math.max(...la),lo0=Math.min(...lo),lo1=Math.max(...lo),k=Math.cos((la0+la1)/2*Math.PI/180),W=800,H=460,m=48;
const w=(lo1-lo0)*k||1e-4,h=(la1-la0)||1e-4,s=Math.min((W-2*m)/w,(H-2*m)/h),ox=(W-w*s)/2,oy=(H-h*s)/2;
const X=p=>ox+(p[1]-lo0)*k*s,Y=p=>H-oy-(p[0]-la0)*s,d=P.map((p,i)=>(i?"L":"M")+X(p).toFixed(1)+" "+Y(p).toFixed(1)).join("");
let g="";for(let i=0;i<=W;i+=50)g+=`M${i} 0V${H}`;for(let i=0;i<=H;i+=50)g+=`M0 ${i}H${W}`;
let sg="";for(let i=1;i<P.length;i++){const u=P[i-1],z=P[i],dd=z[3]-u[3],gr=dd>0?(z[2]-u[2])/dd*100:0,cl=!r.ele?"var(--acc)":gr>6?"var(--bad)":gr>3?"var(--warn)":gr<-3?"#3b82f6":"var(--ok)";sg+=`<path d="M${X(u).toFixed(1)} ${Y(u).toFixed(1)}L${X(z).toFixed(1)} ${Y(z).toFixed(1)}" stroke="${cl}" stroke-width="4.5" stroke-linecap="round"/>`}const ppk=s/111.32,kmb=[.5,1,2,5,10,20,50].filter(v=>v*ppk<=170).pop()||.5,bw=kmb*ppk,a=P[0],z=P[P.length-1];
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recorregut de ${esc(r.name)} dibuixat a partir del GPX"><path d="${g}" stroke="var(--line)" stroke-width="1" opacity=".7"/>
<path d="${d}" fill="none" stroke="var(--card)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>${sg}
<circle cx="${X(a).toFixed(1)}" cy="${Y(a).toFixed(1)}" r="8" fill="var(--ok)" stroke="var(--card)" stroke-width="3"/><circle cx="${X(z).toFixed(1)}" cy="${Y(z).toFixed(1)}" r="8" fill="var(--bad)" stroke="var(--card)" stroke-width="3"/>
<path d="M24 ${H-24}h${bw.toFixed(0)}M24 ${H-30}v12M${(24+bw).toFixed(0)} ${H-30}v12" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="24" y="${H-36}" font-size="14" fill="var(--ink)" font-family="Archivo,sans-serif">${kmb} km</text>
<text x="${W-30}" y="34" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle" font-family="Archivo,sans-serif">N</text><path d="M${W-30} 42v22M${W-36} 50l6-8 6 8" stroke="var(--ink)" stroke-width="2" fill="none"/></svg>`}
function elSVG(r){
const P=r.pts,W=800,H=170,pl=44,pb=22,tot=P[P.length-1][3]||1,mn=r.min,rg=Math.max(10,r.max-mn);
const X=p=>pl+p[3]/tot*(W-pl-8),Y=p=>H-pb-(p[2]-mn)/rg*(H-pb-14),l=P.map((p,i)=>(i?"L":"M")+X(p).toFixed(1)+" "+Y(p).toFixed(1)).join("");
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil d’altitud"><path d="${l}L${X(P[P.length-1]).toFixed(1)} ${H-pb}L${pl} ${H-pb}Z" fill="var(--acc)" opacity=".16"/><path d="${l}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>
<g font-size="12" fill="var(--mut)" font-family="Archivo,sans-serif"><text x="${pl-6}" y="18" text-anchor="end">${r.max} m</text><text x="${pl-6}" y="${H-pb}" text-anchor="end">${r.min} m</text><text x="${pl}" y="${H-5}">0 km</text><text x="${W-8}" y="${H-5}" text-anchor="end">${nf(tot/1000,1)} km</text></g></svg>`}
function rutes(){
const r=S.routes.find(x=>x.id===S.rsel)||S.routes[0],b=S.bikes.length?bike():null;
let h=head("Rutes","Puja un fitxer GPX de les teves sortides i veges el recorregut i el perfil d’altitud.")+
`<div class="drop" id="dz"><b>Puja els teus GPX</b><span class="mut">Els quilòmetres se sumen sols a la bici seleccionada.</span><input id="gpx" class="fi" type="file" accept=".gpx,application/gpx+xml,.xml" multiple>${S.ok?`<div class="mut">${S.ok}</div>`:""}${S.msg?`<div class="err">${S.msg}</div>`:""}</div>`;
if(!r)return h;
const dt=r.dur?`${Math.floor(r.dur/3600)} h ${Math.round(r.dur%3600/60)} min`:"";
return h+`<div class="rl">${S.routes.map(x=>`<button class="pill bk ${x.id===r.id?"on":""}" data-a="rpick" data-id="${x.id}" style="min-width:0"><b>${esc(x.name)}</b><span>${nf(x.dist/1000,1)} km</span></button>`).join("")}</div>
<section class="panel"><div class="kp"><div><span class="mut">Distància</span><b>${nf(r.dist/1000,1)} km</b></div>${r.ele?`<div><span class="mut">Desnivell positiu</span><b>${nf(r.gain)} m</b></div><div><span class="mut">Altitud màxima</span><b>${r.max} m</b></div>`:""}${dt?`<div><span class="mut">Durada</span><b>${dt}</b></div>`:""}<div><span class="mut">Data</span><b style="font-size:17px">${new Date(r.date).toLocaleDateString("ca")}</b></div></div>
<div class="map">${mapSVG(r)}</div>${r.ele?'<div class="lgd2" style="padding:10px 18px;border-top:1px solid var(--line)"><div><span style="background:var(--ok)"></span>Pla o pujada suau</div><div><span style="background:var(--warn)"></span>Pujada moderada</div><div><span style="background:var(--bad)"></span>Pujada dura</div><div><span style="background:#3b82f6"></span>Baixada</div></div>':""}${r.ele?`<div class="el" style="padding:8px 12px 0">${elSVG(r)}</div>`:""}
<div class="rt">${b&&!r.added?`<button class="btn s" data-a="radd">Suma ${nf(r.dist/1000,1)} km a ${esc(b.name)}</button>`:r.added?`<span class="mut">Quilòmetres ja sumats al garatge</span>`:""}<button class="btn g s" data-a="rdel">Elimina la ruta</button></div></section>`}
function soon(t){const d=SOON[t];return head(d[0],"En preparació")+`<div class="panel soon"><p style="margin:0">${d[1]}</p></div>`}
function render(){
$("#nav").innerHTML=`<div class="logo"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--acc)" stroke-width="3" stroke-dasharray="5 3"/><circle cx="16" cy="16" r="5" fill="var(--ink)"/></svg>Cadència</div>`+TABS.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-a="tab" data-t="${t[0]}">${NI(t[0])}<span>${t[1]}</span></button>`).join("")+`<div class="sp"></div><button data-a="theme">${NI("tema")}<span>Tema</span></button>`;
const V={garatge,rutes,pes,mant,ia};$("#view").innerHTML=(V[S.tab]||(()=>soon(S.tab)))();const mg=$("#msgs");if(mg)mg.scrollTop=mg.scrollHeight;save()}
function fld(f,v){const k=f[0],o=f[2];let h;
if(o==="t")h=`<input id="f_${k}" value="${esc(v)}" maxlength="40">`;
else if(o==="n")h=`<input id="f_${k}" type="number" min="0" max="999999" step="any" value="${v||""}">`;
else if(o==="c")h=`<div class="sw">${["#0b5f8a","#c9343a","#1a8f5c","#12181d","#e4e6e8","#e08a1e","#6b3fa0","#d85a9a"].map(c=>`<button type="button" style="background:${c}" data-a="sw" data-c="${c}" aria-label="Color ${c}"></button>`).join("")}<input id="f_color" type="color" value="${v}" aria-label="Color personalitzat"></div>`;
else h=`<select id="f_${k}">${o.map(x=>`<option${String(x)===String(v)?" selected":""}>${esc(x)}</option>`).join("")}</select>`;
return `<div class="fl${o==="c"?" w":""}"><label for="f_${k}">${f[1]}</label>${h}</div>`}
function openDlg(edit){D=edit?bike().id:null;const b=edit?bike():DEF;
$("#dlg").innerHTML=`<h2>${edit?"Configuració de la bici":"Afegeix una bici"}</h2><div class="fg">${FLD.map(f=>typeof f==="string"?`<h3>${f}</h3>`:(f[0]==="km"&&edit)?"":fld(f,b[f[0]])).join("")}</div><div class="row"><button class="btn g" data-a="close">Cancel·la</button><button class="btn" data-a="save">Desa</button></div>`;$("#dlg").showModal()}
function addFiles(fs){S.ok="";S.tab="rutes";S.part=null;const b=S.bikes.length?bike():null;Promise.all([...fs].map(async f=>{try{const r=parseGPX(await f.text(),f.name.replace(/\.gpx$/i,""));if(r){if(b){addKm(b,Math.round(r.dist/1000));r.added=true;S.ok="S’han sumat "+nf(r.dist/1000,1)+" km a "+esc(b.name)+"."}S.routes.unshift(r);S.rsel=r.id;S.msg=""}else S.msg="No hem trobat cap recorregut dins de "+esc(f.name)+". Comprova que sigui un GPX amb track."}catch(x){S.msg="No hem pogut llegir "+esc(f.name)+"."}})).then(render)}
document.addEventListener("change",e=>{const t=e.target;if(t.id==="gpx"){addFiles(t.files);t.value=""}else if(t.id==="pic"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);bike().img=c.toDataURL("image/jpeg",.8);render()};im.src=fr.result};fr.readAsDataURL(t.files[0]);t.value=""}});
document.addEventListener("dragover",e=>{if(e.target.closest("#dz")){e.preventDefault();$("#dz").classList.add("on")}});
document.addEventListener("dragleave",e=>{const z=$("#dz");if(z)z.classList.remove("on")});
document.addEventListener("drop",e=>{if(e.target.closest("#dz")){e.preventDefault();addFiles(e.dataTransfer.files)}});
document.addEventListener("click",e=>{
const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,b=S.bikes.length?bike():null;
if(a==="tab"){S.tab=el.dataset.t;S.confirm=null;S.part=null}
else if(a==="part"){S.part=el.dataset.k;scrollTo(0,0)}
else if(a==="back"){S.part=null;scrollTo(0,0)}
else if(a==="cond"){S.cond=el.dataset.c}
else if(a==="send"){const q=$("#q");ask(q.value);q.value="";return}
else if(a==="ask"){ask(el.dataset.q);return}
else if(a==="clear"){S.chat=[]}
else if(a==="pick"){S.sel=+el.dataset.id;S.confirm=null;S.part=null}
else if(a==="new"){openDlg(false);return}
else if(a==="edit"){openDlg(true);return}
else if(a==="close"){$("#dlg").close();return}
else if(a==="sw"){$("#f_color").value=el.dataset.c;return}
else if(a==="save"){const nb={};FLD.forEach(f=>{if(typeof f!=="string"&&$("#f_"+f[0]))nb[f[0]]=$("#f_"+f[0]).value});nb.tireW=+nb.tireW;nb.spd=+nb.spd;nb.wt=+nb.wt||0;nb.name=nb.name.trim()||nb.brand.trim()||"La meva bici";
if(D){Object.assign(bike(D),nb)}else{const km=Math.max(0,Math.round(+nb.km)||0),w={};delete nb.km;PARTS.forEach(p=>w[p.k]=Math.min(km,p.life*1.2));nb.id=Date.now();nb.total=km;nb.w=w;S.bikes.push(nb);S.sel=nb.id}S.tab="garatge";$("#dlg").close()}
else if(a==="km"){const v=Math.round(+$("#km").value);if(!(v>0)){$("#km").focus();return}b.total+=v;PARTS.forEach(p=>b.w[p.k]=Math.min(p.life*1.2,b.w[p.k]+v))}
else if(a==="reset"){b.w[el.dataset.k]=0}
else if(a==="del"){if(S.confirm===b.id){S.bikes=S.bikes.filter(x=>x.id!==b.id);S.sel=S.bikes[0]?S.bikes[0].id:null;S.confirm=null}else S.confirm=b.id}
else if(a==="rpick"){S.rsel=+el.dataset.id}
else if(a==="rdel"){const cur=S.routes.find(y=>y.id===S.rsel)||S.routes[0];S.routes=S.routes.filter(x=>x!==cur);S.rsel=S.routes[0]?S.routes[0].id:null}
else if(a==="radd"){const r=S.routes.find(x=>x.id===S.rsel)||S.routes[0],v=Math.round(r.dist/1000);b.total+=v;PARTS.forEach(p=>b.w[p.k]=Math.min(p.life*1.2,b.w[p.k]+v));r.added=true}
else if(a==="theme"){const d=document.documentElement,dk=(d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";d.dataset.theme=dk?"light":"dark";return}
render()});
document.addEventListener("keydown",e=>{if(e.target.id==="q"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();const q=e.target;ask(q.value);q.value=""}});
if(S.chat&&S.chat.length&&S.chat[S.chat.length-1].r==="a"&&!S.chat[S.chat.length-1].t)S.chat=S.chat.slice(0,-2);
render();
</script>
